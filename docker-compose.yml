services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_storage

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      SMARTOPS_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  chroma_data:
